name: Update Data

# Rebuilds the Binary Days website data every 30 minutes and publishes it to the "data" branch,
# which the website reads directly. Public repos get unlimited free Actions minutes.
on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get the scripts
        uses: actions/checkout@v4

      - name: Get the current data (previous run's output)
        run: |
          git fetch --depth=1 origin data:data 2>/dev/null && git worktree add out data || mkdir -p out

      - name: Get the catalyst spreadsheet (read-only, from the private repo)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: owenakwan/catalyst-alert
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          sparse-checkout: biotech_catalysts_master.xlsx
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Catalysts, news-found dates, earnings calendar
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          XLSX_PATH: private/biotech_catalysts_master.xlsx
          OUT_DIR: out
        run: python build_site_data.py

      - name: Insider trades (SEC Form 4)
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          OUT_DIR: out
        run: python build_insiders.py

      - name: News headlines
        continue-on-error: true
        env:
          OUT_DIR: out
        run: python build_news.py

      - name: Company profiles and earnings volatility
        continue-on-error: true
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          OUT_DIR: out
        run: python build_market_extras.py

      - name: Publish to the data branch (one commit, replaced each run)
        run: |
          cd out
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Data as of $(TZ=America/Chicago date '+%Y-%m-%d %H:%M %Z')"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          ls -la
